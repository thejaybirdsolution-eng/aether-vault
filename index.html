<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaybird — Release Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Subtle Monochromatic Studio Lighting & Grid -->
  <div class="studio-lighting"></div>
  <div class="studio-grid"></div>

  <!-- Zero-Scroll 100dvh Architectural Shell -->
  <main class="viewport-shell">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand-group">
        <div class="brand-mark">JB</div>
        <div class="brand-title">
          <span>Jaybird Archive</span>
          <span class="brand-divider">/</span>
          <span class="brand-meta">14 Releases · 165.3 MB</span>
        </div>
      </div>

      <!-- Segmented Filter Bar -->
      <nav class="filter-nav" aria-label="Filter Releases">
        <button class="filter-btn active" data-filter="all">
          All <span class="filter-count">14</span>
        </button>
        <button class="filter-btn" data-filter="starred">
          <span class="star-glyph">★</span> Starred <span class="filter-count">4</span>
        </button>
        <button class="filter-btn" data-filter="android">
          Android APK <span class="filter-count">3</span>
        </button>
        <button class="filter-btn" data-filter="pokemon">
          Pokémon GBA <span class="filter-count">5</span>
        </button>
        <button class="filter-btn" data-filter="original">
          Original GBA <span class="filter-count">6</span>
        </button>
      </nav>

      <!-- Search Field -->
      <div class="utility-group">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" class="search-field" placeholder="Filter builds..." autocomplete="off" />
          <span class="search-shortcut">/</span>
        </div>
      </div>
    </header>

    <!-- Main Zero-Scroll Content Stage -->
    <section class="main-stage">
      <!-- Tier 1: The 4 Starred Flagships -->
      <div class="tier-section tier-featured">
        <div class="section-header">
          <span class="section-label">
            <span class="star-dot">★</span> Featured Flagships
          </span>
          <span class="section-sub">01 — 04 / Priority Releases</span>
        </div>
        <div class="featured-grid" id="featured-grid"></div>
      </div>

      <!-- Tier 2: The 10 Library Builds (5 x 2 Grid) -->
      <div class="tier-section tier-library">
        <div class="section-header">
          <span class="section-label">Complete Build Library</span>
          <span class="section-sub">05 — 14 / Direct Binary Downloads</span>
        </div>
        <div class="library-grid" id="library-grid"></div>
      </div>
    </section>

    <!-- Bottom Architectural Status Bar -->
    <footer class="statusbar">
      <div class="status-left">
        <span class="live-indicator"></span>
        <span id="status-inspect">Ready — Click any card to download immediately</span>
      </div>
      <div class="status-right">
        <span>CDN: GitHub Pages Direct</span>
        <span id="status-count">14 / 14 Visible</span>
      </div>
    </footer>
  </main>

  <!-- Toast Container -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="app.js"></script>
</body>
</html>
